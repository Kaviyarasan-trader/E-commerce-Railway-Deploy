<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="goldGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9D976"/>
      <stop offset="0.55" stop-color="#E7B23B"/>
      <stop offset="1" stop-color="#C08C1E"/>
    </linearGradient>
    <radialGradient id="badgeGrad2" cx="0.5" cy="0.42" r="0.8">
      <stop offset="0" stop-color="#16224E"/>
      <stop offset="1" stop-color="#0B1230"/>
    </radialGradient>
  </defs>

  <!-- badge group scaled into the upper area -->
  <g transform="translate(512 352) scale(0.66) translate(-512 -512)">
    <circle cx="512" cy="512" r="470" fill="url(#badgeGrad2)"/>
    <circle cx="512" cy="512" r="470" fill="none" stroke="#D4AF37" stroke-width="9"/>
    <circle cx="512" cy="512" r="447" fill="none" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="2.5"/>

    <path d="M352 468 H406" stroke="url(#goldGrad2)" stroke-width="13" stroke-linecap="round"/>
    <path d="M326 508 H406" stroke="url(#goldGrad2)" stroke-width="13" stroke-linecap="round"/>
    <path d="M344 548 H394" stroke="url(#goldGrad2)" stroke-width="13" stroke-linecap="round"/>

    <path d="M408 452 C 408 352, 616 352, 616 452" fill="none" stroke="url(#goldGrad2)" stroke-width="26" stroke-linecap="round"/>

    <rect x="400" y="452" width="224" height="180" rx="26" fill="url(#goldGrad2)"/>
    <rect x="400" y="452" width="224" height="30" rx="15" fill="#F9D976" opacity="0.9"/>

    <path d="M482 484 L482 566" stroke="#0B1230" stroke-width="27" stroke-linecap="round"/>
    <path d="M494 506 L562 490" stroke="#0B1230" stroke-width="27" stroke-linecap="round"/>
    <path d="M494 542 L562 566" stroke="#0B1230" stroke-width="27" stroke-linecap="round"/>

    <circle cx="444" cy="646" r="16" fill="#B9851C"/>
    <circle cx="580" cy="646" r="16" fill="#B9851C"/>
  </g>

  <!-- wordmark: KAVI in white, BAZAAR in gold -->
  <text x="512" y="856" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="150" letter-spacing="4">
    <tspan fill="#FFFFFF">KAVI</tspan>
    <tspan fill="#D4AF37"> BAZAAR</tspan>
  </text>

  <!-- tagline -->
  <text x="512" y="926" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="300" font-size="46" letter-spacing="12" fill="#C9A33B">
    SHOP MORE, SAVE MORE
  </text>
</svg>
